name: pitstop
description: A social map app for discovering and reviewing places in Vietnam
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  
  # Routing
  go_router: ^17.1.0
  
  # Networking
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  
  # Local Storage
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.2.2
  
  # Forms & Validation
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0
  
  # Maps & Location
  google_maps_flutter: ^2.5.3
  google_places_flutter: ^2.0.9
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  
  # Images
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.0
  cached_network_image: ^3.3.1
  
  # Firebase
  firebase_core: ^4.6.0
  firebase_analytics: ^12.2.0
  firebase_crashlytics: ^5.1.0
  firebase_messaging: ^16.1.3
  
  # Auth
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  
  # UI/UX
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  intl: ^0.20.2
  
  # Utils
  freezed_annotation: ^2.4.1
  logger: ^2.0.2
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.6
  json_serializable: ^6.7.1
  retrofit_generator: ^8.0.4
  freezed: ^2.4.6

  # Testing
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/font/

  fonts:
    - family: HoltwoodOneSC
      fonts:
        - asset: assets/font/HoltwoodOneSC-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/font/Inter.ttf
